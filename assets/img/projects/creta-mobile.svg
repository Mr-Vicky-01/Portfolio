<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480"><title>CRETA - conceptual illustration</title><path fill="#dce5ff" d="M0 0h600v480H0z"/><text x="36" y="55" fill="#1a2445" font-family="Arial,sans-serif" font-size="32" font-weight="700">CRETA</text><text x="36" y="88" fill="#1a2445" font-family="Arial,sans-serif" font-size="23" font-weight="400">A space for your curiosity</text><rect x="30" y="124" width="540" height="320" fill="#fff" rx="14"/><rect x="60" y="151" width="480" height="74" fill="#edf1ff" rx="14"/><text x="82" y="183" fill="#1a2445" font-family="Arial,sans-serif" font-size="24" font-weight="400">What are you curious about?</text><text x="82" y="210" fill="#5c6b8a" font-family="Arial,sans-serif" font-size="22" font-weight="400">Let’s explore an idea.</text><rect x="60" y="256" width="46" height="46" fill="#3159ef" rx="12"/><text x="72" y="289" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="400">✳</text><text x="125" y="289" fill="#1a2445" font-family="Arial,sans-serif" font-size="26" font-weight="700">Start a conversation.</text><text x="60" y="345" fill="#1a2445" font-family="Arial,sans-serif" font-size="23" font-weight="400">Ask a question. Find a new angle.</text><rect x="60" y="382" width="400" height="8" fill="#e0e5f0" rx="4"/><rect x="60" y="402" width="280" height="8" fill="#e0e5f0" rx="4"/></svg>