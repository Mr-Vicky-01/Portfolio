<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800"><title>GenXAi - conceptual project illustration</title><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="25" stdDeviation="24" flood-color="#0b153c" flood-opacity=".16"/></filter><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="halo"><stop stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><path fill="#2848c3" d="M0 0h1000v800H0z"/><circle cx="780" cy="120" r="420" fill="url(#halo)"/><g fill="none" stroke="#fff" opacity=".35"><circle cx="500" cy="390" r="330"/><circle cx="500" cy="390" r="380"/></g><text x="66" y="82" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="700">GenXAi</text><text x="66" y="111" fill="#d6ddff" font-family="Arial, sans-serif" font-size="14" font-weight="400">YOUR NEXT LINE STARTS HERE</text><g filter="url(#shadow)" transform="translate(77 171) rotate(2 420 250)"><rect x="0" y="0" width="846" height="486" rx="16" fill="#111b37" stroke="#6072b4"/><rect x="0" y="0" width="846" height="53" rx="16" fill="#1c294c" stroke="none"/><circle cx="24" cy="27" r="5" fill="#f8a299"/><circle cx="46" cy="27" r="5" fill="#f2ce80"/><circle cx="68" cy="27" r="5" fill="#91cbb4"/><text x="105" y="33" fill="#e0e5ff" font-family="Arial, sans-serif" font-size="15" font-weight="400">GenXAi / coding companion</text><text x="26" y="95" fill="#9bafd9" font-family="Arial, sans-serif" font-size="12" font-weight="400">YOU</text><text x="26" y="130" fill="#fff" font-family="Arial, sans-serif" font-size="21" font-weight="600">How does retrieval-augmented generation work?</text><rect x="25" y="157" width="795" height="1" rx="0" fill="#354369" stroke="none"/><text x="26" y="197" fill="#92acff" font-family="Arial, sans-serif" font-size="12" font-weight="400">GENXAI</text><text x="26" y="230" fill="#dae3ff" font-family="Arial, sans-serif" font-size="18" font-weight="400">Connect a language model to relevant context.</text><rect x="25" y="260" width="491" height="190" rx="10" fill="#0a1126" stroke="none"/><text x="44" y="288" fill="#9bafd9" font-family="Arial, sans-serif" font-size="13" font-weight="400">rag_pipeline.py</text><text x="45" y="323" fill="#a6b9ff" font-family="monospace" font-size="15" font-weight="400">def answer(question):</text><text x="45" y="353" fill="#e8d7a7" font-family="monospace" font-size="15" font-weight="400">    context = retrieve(question)</text><text x="45" y="383" fill="#c5d4f3" font-family="monospace" font-size="15" font-weight="400">    prompt = build(context, question)</text><text x="45" y="413" fill="#9bd8ca" font-family="monospace" font-size="15" font-weight="400">    return model.generate(prompt)</text><text x="549" y="292" fill="#9bafd9" font-family="Arial, sans-serif" font-size="12" font-weight="400">THINK IT THROUGH</text><text x="549" y="330" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="400">01   Retrieve context</text><text x="549" y="373" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="400">02   Build the prompt</text><text x="549" y="416" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="400">03   Generate an answer</text></g><text x="80" y="730" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="600">GEMINI × LANGCHAIN</text><text x="681" y="730" fill="#d6ddff" font-family="Arial, sans-serif" font-size="14" font-weight="400">QUESTION. CODE. LEARN.</text></svg>